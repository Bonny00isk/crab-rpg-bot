<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>Crab RPG · Abyss</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#06131f;--panel:#102536;--panel2:#132d40;--line:#234458;--cyan:#70e4e4;--blue:#49a9d8;--gold:#ffd27a;--text:#edf8ff;--muted:#91adbf;--danger:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 55% at 50% -10%,#1b4c64 0%,#0b2435 42%,var(--bg) 82%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 16px calc(20px + env(safe-area-inset-bottom));}
main{max-width:520px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 16px}.brand{font-size:12px;letter-spacing:2.4px;color:var(--cyan);font-weight:800}.brand strong{display:block;font-size:24px;letter-spacing:-.6px;color:white;margin-top:4px}.avatar{width:48px;height:48px;border-radius:17px;background:linear-gradient(145deg,#2a6b83,#112b40);border:1px solid #4789a0;display:grid;place-items:center;font-size:27px;box-shadow:0 8px 24px #0004}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:700}.panel{background:linear-gradient(145deg,#132d40ee,#0d2131f2);border:1px solid #24465b;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 12px 32px #0002}.hero{position:relative;overflow:hidden;padding:20px}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-90px;background:#4cc5d414;border:1px solid #4cc5d422}.hero-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:5px 0}.rank{font-size:12px;color:var(--gold);background:#614c263f;border:1px solid #8e713a66;padding:6px 9px;border-radius:20px;white-space:nowrap}.crab-art{height:126px;display:grid;place-items:center;font-size:82px;filter:drop-shadow(0 12px 18px #42d4e433);animation:float 3s ease-in-out infinite}.sub{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#07192588;border:1px solid #234355;border-radius:14px;padding:12px 10px}.stat b{display:block;font-size:17px;margin-top:5px}.stat span{font-size:11px;color:var(--muted)}.section-title{font-size:16px;font-weight:800;margin:2px 0 14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:15px;padding:15px 12px;font-size:14px;font-weight:800;color:#06202b;background:linear-gradient(135deg,#8af2e5,#4eb8d9);box-shadow:0 8px 22px #1d9db533;cursor:pointer}.btn.secondary{background:linear-gradient(135deg,#213f55,#193246);border:1px solid #365a70;color:#e9f8ff;box-shadow:none}.btn.gold{background:linear-gradient(135deg,#ffe5a3,#eab85d);color:#39280b;box-shadow:0 8px 22px #d7a54a22}.btn:disabled{opacity:.45;cursor:default}.bar{height:7px;background:#061722;border-radius:10px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4eabc9,#83eee0);border-radius:10px}.battle{border-color:#7b493f;background:linear-gradient(145deg,#2c1d2a,#122332)}.monster{font-size:52px;text-align:center;margin:8px}.battle .bar i{background:linear-gradient(90deg,#ff765e,#ffc17b)}.log{font-size:13px;color:#c7dce7;line-height:1.5;margin-top:12px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#0a1c2a;border:1px solid #2a4c61;border-radius:16px;padding:14px;color:var(--text);cursor:pointer}.choice .symbol{font-size:30px}.choice b{display:block;font-size:14px;margin-bottom:4px}.choice small{color:var(--muted);font-size:12px;line-height:1.35}.footer{text-align:center;color:#5f7e91;font-size:11px;padding:12px}.notice{padding:16px;border-radius:16px;background:#251f17;border:1px solid #6b5835;color:#ffe3a4;font-size:13px;line-height:1.5}.loading{padding:60px 0;text-align:center;color:var(--muted)}.spinner{display:inline-block;width:28px;height:28px;border:3px solid #315064;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}.appnav{position:fixed;z-index:8;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:4px;background:#06131fee;border-top:1px solid #24465b;backdrop-filter:blur(14px)}.appnav button{border:0;background:transparent;color:#7f9daf;font-size:10px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}.appnav button span{font-size:18px}.appnav button.active{color:#83eee0}.rowitem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #24465b;font-size:13px}.rowitem:last-child{border-bottom:0}.rowitem span{white-space:nowrap}.rowitem button{background:#19384c;border:1px solid #376078;border-radius:9px;padding:7px 9px;color:#dff8ff;font-size:11px}.panel h3{font-size:14px;margin:20px 0 8px;color:#8ce8e2}body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:488px;margin:auto;padding:13px 16px;border:1px solid #416579;border-radius:14px;background:#102b3beF;color:white;font-size:13px;box-shadow:0 12px 30px #0007;z-index:10}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="app"><div class="loading"><div class="spinner"></div><div>Погружаемся в бездну…</div></div></main>
<script>
(() => {
const tg=window.Telegram?.WebApp;
const app=document.getElementById('app');
let state=null, busy=false, lastLog='';
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#071522');tg.setBackgroundColor('#071522');tg.enableClosingConfirmation();}catch(e){}}
const initData=tg?.initData||'';
const user=tg?.initDataUnsafe?.user||{};
const num=n=>Number(n||0).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
async function api(path,method='GET',body=null){
 const res=await fetch(path,{method,headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(!res.ok){let msg='Не удалось выполнить действие';try{msg=await res.text()}catch(e){};throw new Error(msg)}
 return res.json();
}
function stats(){return state?.stats||{}}
function render(){
 if(!state){app.innerHTML='<div class="loading">Не удалось загрузить игру</div>';return}
 if(!state.registered){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">Профиль не найден. Нажми /start в боте, затем снова открой Web App.</div></div>';return}
 const greeting=esc(state.nickname||user.first_name||'Путник');
 let head='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div>';
 if(state.needs_crab){
  app.innerHTML=head+'<section class="panel hero"><div class="eyebrow">Твоё путешествие начинается</div><div class="name">Выбери своего краба</div><p class="sub">У каждого вида свой стиль боя. Выбор определит начальные характеристики.</p><div class="crab-art">🦀</div><div class="choices">'+state.crabs.map(c=>'<button class="choice" onclick="chooseCrab('+c.id+')"><span class="symbol">'+(['🦀','🦞','🦐'][c.id-1]||'🦀')+'</span><span><b>'+esc(c.name)+'</b><small>'+esc(c.desc)+'</small></span></button>').join('')+'</div></section><div class="footer">Профиль привязан к твоему Telegram</div>';
  return;
 }
 const s=stats(),inBattle=!!state.in_hunt,b=state.battle;
 app.innerHTML=head+
 '<section class="panel hero"><div class="hero-head"><div><div class="eyebrow">'+esc(state.zone)+'</div><div class="name">'+greeting+'</div><div class="sub">'+esc(state.crab_name)+' · уровень '+num(state.crab_level)+'</div></div><div class="rank">'+esc(state.rank)+'</div></div><div class="crab-art">'+(['🦀','🦞','🦐'][Number(state.crab_type)-1]||'🦀')+'</div><div class="stats"><div class="stat"><span>💰 Золото</span><b>'+num(state.gold)+'</b></div><div class="stat"><span>🧬 ДНК</span><b>'+num(state.dna_points)+'</b></div><div class="stat"><span>🐚 Раковины</span><b>'+num(state.shells)+'</b></div></div><div class="stats"><div class="stat"><span>🌊 Рекорд</span><b>'+num(state.max_meters)+' м</b></div><div class="stat"><span>☠️ Убийства</span><b>'+num(state.kills)+'</b></div><div class="stat"><span>🦋 Линьки</span><b>'+num(state.molts)+'</b></div></div></section>'+
 (inBattle&&b?'<section class="panel battle"><div class="eyebrow">Сражение · '+num(b.meters)+' м</div><div class="section-title">'+esc(b.name)+'</div><div class="monster">🐙</div><div class="sub">Здоровье врага · '+num(b.hp)+' / '+num(b.max_hp)+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,100*b.hp/Math.max(1,b.max_hp)))+'%"></i></div>'+(lastLog?'<div class="log">'+esc(lastLog)+'</div>':'')+'<div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="battleAbility(\'shield\')">🛡️ Панцирь · блок</button><button class="btn secondary" onclick="battleAbility(\'unique\')">'+esc(state.unique?.name||'🌟 Уникальная')+'</button></div>'+'</section>':'')+
 '<section class="panel"><div class="section-title">'+(inBattle?'⚔️ Продолжить бой':'🌊 Исследовать глубины')+'</div><div class="actions"><button class="btn" onclick="hunt()" '+(busy?'disabled':'')+'>'+(inBattle?'✂️ Атаковать':'🔎 Выйти на охоту')+'</button><button class="btn gold" onclick="levelUp()" '+(busy||state.gold<state.level_cost?'disabled':'')+'>⬆️ +1 уровень<br><small style="font-size:11px;font-weight:600">Цена: '+num(state.level_cost)+' 💰</small></button></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="levelUpMax()">⬆️ Повысить максимально за доступное золото</button><div class="sub" style="margin-top:13px">⚔️ Урон '+num(s.damage)+' · 🌊 Уклонение '+num(s.evasion)+'% · 🎯 Крит '+num(s.crit)+'%</div></section>'+
 '<section class="panel"><div class="section-title">📍 Путь по бездне</div><div class="eyebrow">Текущая глубина</div><div class="name">'+num(state.cur_meters)+' м</div><div class="sub">Рекорд: '+num(state.max_meters)+' м</div><div class="bar"><i style="width:'+Math.min(100,state.max_meters/50)+'%"></i></div></section>'+
 '<div class="footer">CRAB RPG · Сохранение в PostgreSQL · Telegram Mini App</div>';
}
async function refresh(){try{state=await api('/api/state');render()}catch(e){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">'+(!initData?'Открой приложение через кнопку Web App внутри Telegram. Прямая ссылка в браузере не передаёт данные авторизации.':esc(e.message))+'</div></div>'}}
async function action(fn){if(busy)return;busy=true;render();try{await fn()}catch(e){toast(e.message)}finally{busy=false;await refresh()}}
window.chooseCrab=id=>action(async()=>{state=await api('/api/choose-crab','POST',{crab_type:id});toast('Краб выбран! Путь начинается.')});
window.levelUp=()=>action(async()=>{const r=await api('/api/level-up','POST',{});state=r.state;toast('Уровень повышен!')});
window.levelUpMax=()=>action(async()=>{const r=await api('/api/level-up/max','POST',{});state=r.state;toast('Повышено на '+r.levels+' уровней за '+num(r.cost)+' золота')});
window.battleAbility=a=>action(async()=>{const r=await api('/api/hunt','POST',{action:'ability',ability:a});state=r.state;lastLog=r.log||'Способность активирована';toast(lastLog)});
window.hunt=()=>action(async()=>{const r=await api('/api/hunt','POST',{});state=r.state;lastLog=r.log|| (r.event==='started'?'Враг появился. Атакуй!':'');toast(r.event==='started'?'Противник обнаружен!':(r.log||'Готово'))});

let currentView='home', extraData=null;
const renderHomeBase=render;
function nav(){
 return '<nav class="appnav">'+[['home','🏠','Главная'],['inventory','🎒','Нора'],['dig','⛏️','Копать'],['mutations','🧬','Мутации'],['craft','🍯','Нектар'],['more','☰','Ещё']].map(([k,e,t])=>'<button class="'+(currentView===k?'active':'')+'" onclick="goView(\''+k+'\')"><span>'+e+'</span>'+t+'</button>').join('')+'</nav>';
}
async function loadExtra(){try{extraData=await api('/api/game-data')}catch(e){toast(e.message)}}
function renderSection(){
 if(!state||!state.registered||state.needs_crab){renderHomeBase();app.insertAdjacentHTML('beforeend',nav());return}
 const x=extraData||{stones:[],resources:[],mutations:[],chests:[],nectar:{},nectars:[],dig:{},evolution:{nodes:{},tree:[]}};
 let title='',body='';
 if(currentView==='inventory'){
  title='🎒 Нора';
  body='<div class="stats"><div class="stat"><span>💰 Золото</span><b>'+num(state.gold)+'</b></div><div class="stat"><span>🧬 ДНК</span><b>'+num(state.dna_points)+'</b></div><div class="stat"><span>🐚 Раковины</span><b>'+num(state.shells)+'</b></div></div><h3>💎 Камни</h3>'+ (x.stones.length?x.stones.map(s=>'<div class="rowitem"><b>'+esc(s.color_name)+' · ур. '+s.level+'</b><span>×'+num(s.count)+'</span></div>').join(''):'<p class="sub">Камней пока нет — отправь краба копать.</p>')+'<h3>📦 Ресурсы</h3>'+x.resources.map(s=>'<div class="rowitem"><b>'+esc(s.name)+'</b><span>×'+num(s.count)+'</span></div>').join('')+'<h3>🎁 Сундуки</h3>'+ (x.chests.length?x.chests.map(s=>'<div class="rowitem"><b>'+esc(s.name)+'</b><span>×'+num(s.count)+' <button onclick="openChest(\\''+s.key+'\\')">Открыть</button></span></div>').join(''):'<p class="sub">Сундуков нет.</p>')+'<h3>🧪 Мутации в коллекции</h3>'+ (x.mutations.length?x.mutations.map(m=>'<div class="rowitem"><b>'+esc(m.name)+' · ур. '+m.level+'</b><span>'+(m.equipped?'Надето':'В коллекции')+'</span></div>').join(''):'<p class="sub">Мутаций пока нет.</p>');
 }else if(currentView==='dig'){
  title='⛏️ Копание';
  const d=x.dig||{}, started=Number(d.start||0),duration=Number(d.duration||0),left=Math.max(0,duration-(Math.floor(Date.now()/1000)-started));
  body=started? (left>0?'<div class="notice">Краб копает дно. Осталось примерно '+Math.ceil(left/60)+' минут.</div>':'<div class="notice">🎁 Копание завершено! Можно забрать добычу.</div><button class="btn gold" onclick="digCollect()">Забрать добычу</button>') :'<p class="sub">Выбери продолжительность экспедиции. Камни и ресурсы будут добавлены в инвентарь после сбора.</p><div class="choices">'+(d.hours||[2,4,16,24]).map(h=>'<button class="choice" onclick="digStart('+h+')"><span class="symbol">⛏️</span><span><b>'+h+' часов</b><small>Отправить краба добывать материалы</small></span></button>').join('')+'</div>';
 }else if(currentView==='mutations'){
  title='🧬 Лаборатория мутаций';
  const owned=new Set(x.mutations.map(m=>m.key));
  const passive=(x.catalog||[]);
  body='<div class="sub">ДНК: '+num(state.dna_points)+' · Пассивные мутации работают постоянно. Активные занимают слоты.</div><h3>Мои мутации</h3>'+(x.mutations.length?x.mutations.map(m=>'<div class="rowitem"><b>'+esc(m.name)+' · ур. '+m.level+'</b><span>'+(m.active?(m.equipped?'<button onclick="mutAction(\'unequip\',\''+m.key+'\')">Снять</button>':'<button onclick="mutAction(\'equip\',\''+m.key+'\')">Надеть</button>'):'Пассивная')+' <button onclick="mutAction(\'upgrade\',\''+m.key+'\')">Улучшить</button></span></div>').join(''):'<p class="sub">Пока пусто.</p>')+'<h3>Открыть пассивные</h3>'+(x.passiveShop||[]).map(m=>'<div class="rowitem"><b>'+esc(m.name)+'</b><span>'+(owned.has(m.key)?'Есть':'<button onclick="mutAction(\'buy\',\''+m.key+'\')">Купить · '+num(m.cost)+' 🧬</button>')+'</span></div>').join('');
 }else if(currentView==='craft'){
  title='🍯 Лаборатория нектаров';
  const nectar=x.nectar||{}, inv=nectar.nectars_inv||{};
  body='<div class="sub">Надето: '+esc((x.nectars.find(n=>n.key===nectar.active_nectar)||{}).name||'ничего')+'</div>'+(nectar.active_nectar?'<button class="btn secondary" onclick="nectarAction(\'equip\',\'\')">Снять нектар</button>':'')+(x.nectars||[]).map(n=>'<div class="rowitem"><div><b>'+esc(n.name)+'</b><div class="sub">'+esc(n.desc)+'</div><small>В запасе: '+num(n.count)+'</small></div><span><button onclick="nectarAction(\'craft\',\''+n.key+'\')">Крафт</button>'+(n.count?'<button onclick="nectarAction(\'equip\',\''+n.key+'\')">Надеть</button>':'')+'</span></div>').join('');
 }else if(currentView==='more'){
  title='☰ Дополнительно';
  body='<button class="choice" onclick="goView(\'shop\')"><span class="symbol">🛍️</span><span><b>Магазин</b><small>Покупки за раковины и Stars</small></span></button><button class="choice" onclick="redeemPromo()"><span class="symbol">🎟️</span><span><b>Промокод</b><small>Активировать код</small></span></button><button class="choice" onclick="goView(\'evolution\')"><span class="symbol">🌟</span><span><b>Эволюция</b><small>Выбор постоянных бонусов до линьки</small></span></button><button class="choice" onclick="goView(\'leaderboard\')"><span class="symbol">🏆</span><span><b>Топ игроков</b><small>Рейтинг глубины и линек</small></span></button><button class="choice" onclick="goView(\'stats\')"><span class="symbol">📊</span><span><b>Статистика</b><small>Твои игровые достижения</small></span></button><button class="choice" onclick="changeNickname()"><span class="symbol">✏️</span><span><b>Изменить ник</b><small>Один раз в 7 дней</small></span></button><button class="choice" onclick="goView(\'events\')"><span class="symbol">🐉</span><span><b>Мифические события</b><small>Боссы и общий рейтинг урона</small></span></button>';
 }else if(currentView==='evolution'){
  title='🌟 Древо эволюции';
  const evo=x.evolution||{},tree=evo.tree||[],nodes=evo.nodes||{};
  body='<div class="sub">Этап '+num(evo.stage||0)+' · доступно '+Math.max(0,Math.min(10,Math.floor(state.crab_level/50))-Number(evo.stage||0))+' очков</div>'+Object.entries(nodes).filter(([k,n])=>k.startsWith(x.crystal||'')&&!tree.includes(k)).map(([k,n])=>'<div class="rowitem"><b>'+esc(n.name)+'<div class="sub">'+esc(n.desc)+'</div></b><button onclick="evolutionPick(\''+k+'\')">Выбрать</button></div>').join('');
 }else if(currentView==='leaderboard'){
  title='🏆 Топ игроков';
  body='<div class="loading">Загрузка рейтинга…</div>'; loadLeaderboard();
 }else if(currentView==='stats'){
  title='📊 Статистика';
  const s=x.stats||{};
  body='<div class="rowitem"><b>Всего заработано золота</b><span>'+num(s.total_gold)+'</span></div><div class="rowitem"><b>Всего ДНК получено</b><span>'+num(s.total_dna)+'</span></div><div class="rowitem"><b>Убито существ</b><span>'+num(s.kills)+'</span></div><div class="rowitem"><b>Убито боссов</b><span>'+num(s.boss_kills)+'</span></div><div class="rowitem"><b>Линьки</b><span>'+num(state.molts)+'</span></div><div class="rowitem"><b>Рекорд глубины</b><span>'+num(state.max_meters)+' м</span></div>';
 }else if(currentView==='events'){
  title='🐉 Мифические события';
  body='<div class="notice">Линька доступна с 100 уровня. Она сбрасывает уровень, золото и эволюцию, но даёт ДНК. Это действие необратимо.</div><button class="btn gold" onclick="molt()" '+(state.crab_level<100?'disabled':'')+'>🦋 Провести линьку</button><div id="eventsbox" class="sub" style="margin-top:16px">Загружаем событие…</div>'; loadEvents();
 }
 app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><button class="avatar" onclick="goView(\'home\')">🦀</button></div><section class="panel"><div class="section-title">'+title+'</div>'+body+'</section>'+nav();
}
render=function(){if(currentView==='home'){renderHomeBase();app.insertAdjacentHTML('beforeend',nav())}else renderSection()};


let shopData=null;
async function loadShop(){try{shopData=await api('/api/shop');if(currentView==='shop')renderShop()}catch(e){toast(e.message)}}
function renderShop(){const el=app.querySelector('.panel');if(!el||currentView!=='shop')return;el.innerHTML='<div class="section-title">🛍️ Магазин</div><div class="sub">Твои раковины: '+num(shopData.shells)+' 🐚</div><h3>За раковины</h3>'+shopData.shell_items.map(i=>'<div class="rowitem"><b>'+esc(i.title)+'<div class="sub">Цена: '+i.shells+' 🐚</div></b><button onclick="buyShell(\\''+i.key+'\\')">Купить</button></div>').join('')+'<h3>За Telegram Stars</h3>'+shopData.stars_items.map(i=>'<div class="rowitem"><b>'+esc(i.title)+'<div class="sub">'+esc(i.description)+'</div></b><span>'+i.stars+' ⭐</span></div>').join('')+'<p class="sub">Покупки за Stars оформляются через платёжное окно Telegram в боте.</p>'}
window.buyShell=k=>action(async()=>{const r=await api('/api/shop/shell','POST',{key:k});await loadExtra();await loadShop();toast(r.message)});
window.openChest=k=>action(async()=>{const r=await api('/api/chest/open','POST',{key:k});await loadExtra();toast('Сундук открыт! Раковины: '+r.loot.shells+', камней: '+r.loot.stones.length+(r.loot.mutation?' · мутация получена':''))});
window.redeemPromo=()=>{const code=prompt('Введи промокод:');if(code)action(async()=>{const r=await api('/api/promo','POST',{code});await refresh();toast('Промокод активирован!')})};

window.molt=()=>{if(!confirm('Линька сбросит уровень, золото и эволюцию. Продолжить?'))return;action(async()=>{const r=await api('/api/molt','POST',{});state=r.state;currentView='home';await loadExtra();toast('Линька завершена! Получено '+num(r.dna)+' ДНК')})};
async function loadEvents(){try{const r=await api('/api/events');const el=document.getElementById('eventsbox');if(!el)return;if(!r.unlocked){el.innerHTML='<h3>🐉 Ивенты закрыты</h3><p>Нужно выполнить хотя бы одно условие: '+r.requirements.molts+' линьки, рекорд '+r.requirements.meters+' м или '+r.requirements.kills+' убийств.</p>';return}if(!r.event){el.innerHTML='<h3>🌊 Активных ивентов нет</h3><p>События запускаются автоматически. Загляни позже.</p>';return}el.innerHTML='<h3>'+esc(r.event.name)+'</h3><p>'+esc(r.event.description)+'</p><h3>Урон игроков</h3>'+r.event.leaderboard.map((p,i)=>'<div class="rowitem"><b>#'+(i+1)+' '+esc(p.nickname)+'</b><span>'+num(p.damage)+'</span></div>').join('')}catch(e){toast(e.message)}}

window.goView=async v=>{currentView=v;if(v==='home'){render();return}await loadExtra();render();if(v==='shop')await loadShop()};
window.digStart=h=>action(async()=>{await api('/api/dig/start','POST',{hours:h});await loadExtra();toast('Краб отправлен копать!')});
window.digCollect=()=>action(async()=>{const r=await api('/api/dig/collect','POST',{});await loadExtra();toast('Добыча собрана: '+r.stones.length+' камней, '+r.resources.length+' ресурсов')});
window.mutAction=(a,k)=>action(async()=>{const r=await api('/api/mutations/action','POST',{action:a,key:k});await loadExtra();toast(a==='buy'?'Мутация приобретена!':a==='upgrade'?'Мутация улучшена!':'Экипировка обновлена')});
window.nectarAction=(a,k)=>action(async()=>{await api('/api/nectar/action','POST',{action:a,key:k});await loadExtra();toast(a==='craft'?'Нектар создан!':'Нектар экипирован')});
window.evolutionPick=k=>action(async()=>{await api('/api/evolution/pick','POST',{key:k});await loadExtra();toast('Эволюция выбрана!')});
window.changeNickname=()=>{const n=prompt('Новый ник (3–16 символов):',state.nickname);if(n)action(async()=>{await api('/api/nickname','POST',{nickname:n});await refresh();toast('Ник изменён')})};
async function loadLeaderboard(){try{const r=await api('/api/leaderboard');if(currentView==='leaderboard'){const p=app.querySelector('.panel');p.innerHTML='<div class="section-title">🏆 Топ игроков</div>'+r.players.map(x=>'<div class="rowitem"><b>#'+x.rank+' '+esc(x.nickname)+'<div class="sub">'+x.level+' ур. · '+x.molts+' линек · '+esc(x.zone)+'</div></b><span>'+num(x.meters)+' м</span></div>').join('')}}catch(e){toast(e.message)}}

if(!initData){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">Чтобы открыть игру, запусти Crab RPG в Telegram и нажми кнопку Web App. Внешний браузер не передаёт Telegram initData.</div></div>'}else refresh();
})();
</script>
</body>
</html>
