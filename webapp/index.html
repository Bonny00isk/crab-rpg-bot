.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:700}.panel{background:linear-gradient(145deg,#132d40ee,#0d2131f2);border:1px solid #24465b;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 12px 32px #0002}.hero{position:relative;overflow:hidden;padding:20px}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-90px;background:#4cc5d414;border:1px solid #4cc5d422}.hero-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:5px 0}.rank{font-size:12px;color:var(--gold);background:#614c263f;border:1px solid #8e713a66;padding:6px 9px;border-radius:20px;white-space:nowrap}.crab-art{height:126px;display:grid;place-items:center;font-size:82px;filter:drop-shadow(0 12px 18px #42d4e433);animation:float 3s ease-in-out infinite}.sub{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#07192588;border:1px solid #234355;border-radius:14px;padding:12px 10px}.stat b{display:block;font-size:17px;margin-top:5px}.stat span{font-size:11px;color:var(--muted)}.section-title{font-size:16px;font-weight:800;margin:2px 0 14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:15px;padding:15px 12px;font-size:14px;font-weight:800;color:#06202b;background:linear-gradient(135deg,#8af2e5,#4eb8d9);box-shadow:0 8px 22px #1d9db533;cursor:pointer}.btn.secondary{background:linear-gradient(135deg,#213f55,#193246);border:1px solid #365a70;color:#e9f8ff;box-shadow:none}.btn.gold{background:linear-gradient(135deg,#ffe5a3,#eab85d);color:#39280b;box-shadow:0 8px 22px #d7a54a22}.btn:disabled{opacity:.45;cursor:default}.bar{height:7px;background:#061722;border-radius:10px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4eabc9,#83eee0);border-radius: /* ABYSS custom interface — layered deep-sea visual system */
:root{
 color-scheme:dark;--bg:#030b14;--panel:#0a1a2a;--panel2:#10273a;--line:#1c4358;
 --cyan:#70f3df;--blue:#4bbce0;--gold:#f5c979;--text:#edfaff;--muted:#8aa8ba;--danger:#ff8e91;
 --glow:0 0 28px #3bd8d022;--edge:inset 0 1px #ffffff0b,0 18px 48px #0005;
}
html{background:var(--bg);scroll-behavior:smooth}
body{
 background:
  radial-gradient(ellipse 110% 50% at 50% -8%,#12485b 0%,#09283b 35%,transparent 72%),
  radial-gradient(ellipse 70% 40% at 100% 35%,#063c4c55,transparent 65%),
  linear-gradient(180deg,#061523 0%,#030b14 72%,#02070e 100%);
 color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 letter-spacing:.01em;overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.32;
 background-image:radial-gradient(circle at 12% 20%,#7cf7e7 0 1px,transparent 1.8px),radial-gradient(circle at 84% 33%,#8ceaff 0 1px,transparent 2px),radial-gradient(circle at 32% 76%,#6ce7d5 0 1px,transparent 2px),radial-gradient(circle at 67% 88%,#9bdcf7 0 1px,transparent 2px);
 background-size:173px 211px,229px 251px,197px 227px,263px 293px;animation:abyssDrift 22s linear infinite
}
body:after{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.12;
 background:repeating-linear-gradient(90deg,transparent 0 49px,#79dfe811 50px,#79dfe811 51px,transparent 52px 100px);
 mask-image:linear-gradient(to bottom,black,transparent 82%)
}
main{max-width:540px;padding:0 2px}
.top{padding:calc(17px + env(safe-area-inset-top)) 4px 15px;position:relative}
.brand{font-size:10px;letter-spacing:3.5px;color:#7eece0;text-shadow:0 0 18px #51d8d855}
.brand strong{font-size:25px;letter-spacing:1.3px;font-weight:900;margin-top:2px;text-shadow:0 4px 18px #0008}
.avatar{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#1d5265,#092032);border:1px solid #56c6c46b;box-shadow:inset 0 1px #ffffff20,0 8px 26px #0005,0 0 25px #31c8c51a}
.panel{
 position:relative;overflow:hidden;margin:11px 0 14px;padding:19px;
 border:1px solid #2c607066;border-radius:24px;
 background:linear-gradient(145deg,#0c2436f5,#071522f5 72%);
 box-shadow:var(--edge),var(--glow);backdrop-filter:blur(16px)
}
.panel:before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#85f5e977,transparent);pointer-events:none}
.panel:after{content:"";position:absolute;right:-65px;top:-105px;width:180px;height:180px;border-radius:50%;border:1px solid #69e7df12;box-shadow:0 0 0 20px #69e7df06,0 0 0 40px #69e7df04;pointer-events:none}
.hero{padding:21px;background:radial-gradient(ellipse at 82% 18%,#1c647044,transparent 46%),linear-gradient(145deg,#102e43f5,#071522fa 75%);border-color:#3c819044}
.hero-head{position:relative;z-index:1}
.eyebrow{font-size:10px;letter-spacing:2px;color:#8eb8c8}
.name{font-size:25px;line-height:1.1;font-weight:850;letter-spacing:-.8px;margin:7px 0}
.rank{background:linear-gradient(135deg,#6d522433,#211d19);border:1px solid #d8b66a66;color:#f4d68d;font-size:10px;font-weight:800;letter-spacing:.6px;padding:7px 10px;box-shadow:inset 0 1px #ffffff12}
.crab-art{
 height:148px;margin:5px -4px 2px;position:relative;isolation:isolate;
 display:grid;place-items:center;font-size:88px;
 filter:drop-shadow(0 12px 18px #35d5df2b);animation:crabFloat 4.4s ease-in-out infinite
}
.crab-art:before{
 content:"";position:absolute;z-index:-1;width:145px;height:145px;border-radius:50%;
 background:radial-gradient(circle,#47d8d52c 0%,#2e9cba12 48%,transparent 72%);
 border:1px solid #6cece51e;box-shadow:0 0 45px #25b9c21a,inset 0 0 32px #6cece511
}
.crab-art:after{content:"";position:absolute;z-index:-1;width:210px;height:210px;border-radius:50%;border:1px dashed #6cece51b;animation:abyssSpin 34s linear infinite}
.section-title{font-size:16px;font-weight:850;letter-spacing:.15px;margin:1px 0 16px}
.sub{color:#91adbf;font-size:12px;line-height:1.55}
.stats{gap:8px;margin-top:17px}
.stat{background:linear-gradient(145deg,#071725,#0b2130);border:1px solid #23495b;border-radius:16px;padding:12px 10px;box-shadow:inset 0 1px #ffffff08}
.stat b{font-size:18px;font-weight:850;color:#e8fbff}
.stat span{font-size:10px;letter-spacing:.3px;color:#86a9bb}
.actions{gap:9px}
.btn{border-radius:14px;padding:14px 13px;font-size:13px;letter-spacing:.1px;background:linear-gradient(135deg,#8ef5df,#45b9d8);box-shadow:0 7px 22px #1d9db522,inset 0 1px #ffffff80;transition:transform .16s,filter .16s}
.btn:active,.choice:active{transform:scale(.985);filter:brightness(1.12)}
.btn.secondary{background:linear-gradient(145deg,#17394f,#0d2436);border:1px solid #3b6579;color:#dff8ff;box-shadow:inset 0 1px #ffffff0a}
.btn.gold{background:linear-gradient(135deg,#f8df9d,#d5a64d);color:#30220b;box-shadow:0 7px 22px #d7a54a18,inset 0 1px #ffffff88}
.choice{background:linear-gradient(145deg,#0d2638,#081725);border:1px solid #254c60;border-radius:17px;padding:14px;box-shadow:inset 0 1px #ffffff08;transition:border-color .18s,transform .18s}
.choice:hover{border-color:#4ba9b177}
.choice .symbol{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#164054,#0a2030);border:1px solid #3c778055;font-size:24px}
.choice b{font-size:13px;letter-spacing:.1px}
.choice small{font-size:11px;line-height:1.45}
.bar{height:8px;background:#020c15;border:1px solid #17394b;margin-top:11px}
.bar i{background:linear-gradient(90deg,#31a9ce,#74f0d9);box-shadow:0 0 13px #44d9ce55}
.battle{background:radial-gradient(ellipse at top,#4d222c66,transparent 55%),linear-gradient(145deg,#211724,#0a1725);border-color:#9c5c5c55}
.monster{filter:drop-shadow(0 8px 15px #f2766530)}
.battle .bar i{background:linear-gradient(90deg,#f26367,#ffc276)}
.log{font-size:12px;line-height:1.65;color:#c5dce7;background:#06121e99;border:1px solid #24435466;border-radius:13px;padding:11px}
.notice{background:linear-gradient(145deg,#302718,#1b1712);border:1px solid #80663b;color:#f8dda0;border-radius:16px}
.rowitem{border-bottom-color:#1d3e50;padding:13px 0;font-size:12px}
.rowitem b{font-weight:750}
.rowitem button{background:linear-gradient(145deg,#174157,#0b2637);border:1px solid #3c7186;border-radius:10px;padding:8px 10px;color:#e5fbff;font-size:11px;font-weight:700}
.panel h3{font-size:13px;letter-spacing:.25px;color:#83e9dc;margin:21px 0 9px}
.appnav{
 background:linear-gradient(180deg,#071522ed,#030b14fa);border-top:1px solid #28516488;
 padding:9px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(22px);
 box-shadow:0 -12px 35px #0005
}
.appnav button{font-size:9px;font-weight:700;letter-spacing:.2px;color:#7895a8;transition:color .15s}
.appnav button span{font-size:20px;filter:saturate(.8)}
.appnav button.active{color:#7ef0df;text-shadow:0 0 16px #54d9d555}
.toast{background:linear-gradient(145deg,#14374b,#071925);border:1px solid #4d8b9d;border-radius:16px;box-shadow:0 14px 35px #0008,0 0 25px #3bd8d018}
input,select,textarea{background:#071724!important;color:#eafaff!important;border:1px solid #2a5266!important;border-radius:12px!important}
.loading{color:#8cb4c4}
.spinner{border-color:#1a4053;border-top-color:#7af0df;box-shadow:0 0 18px #38cfcf22}
.footer{color:#527387}
@keyframes crabFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes abyssSpin{to{transform:rotate(360deg)}}
@keyframes abyssDrift{to{background-position:0 -420px,0 390px,0 -340px,0 470px}}
@media(min-width:520px){main{padding:0 8px}.panel{padding:22px}.hero{padding:24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

</style>
</head>
<body>
<main id="app"><div class="loading"><div class="spinner"></div><div>Погружаемся в бездну…</div></div></main>
<script>
(() => {
const tg=window.Telegram?.WebApp;
const app=document.getElementById('app');
let state=null, busy=false, lastLog='';
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#071522');tg.setBackgroundColor('#071522');tg.enableClosingConfirmation();}catch(e){}}
const initData=tg?.initData||'';
const user=tg?.initDataUnsafe?.user||{};
const num=n=>Number(n||0).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
async function api(path,method='GET',body=null){
 const res=await fetch(path,{method,headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(!res.ok){let msg='Не удалось выполнить действие';try{msg=await res.text()}catch(e){};throw new Error(msg)}
 return res.json();
}
function stats(){return state?.stats||{}}
function render(){
 if(!state){app.innerHTML='<div class="loading">Не удалось загрузить игру</div>';return}
 if(!state.registered){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">Профиль не найден. Нажми /start в боте, затем снова открой Web App.</div></div>';return}
 const greeting=esc(state.nickname||user.first_name||'Путник');
 let head='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div>';
 if(state.needs_crab){
  app.innerHTML=head+'<section class="panel hero"><div class="eyebrow">Твоё путешествие начинается</div><div class="name">Выбери своего краба</div><p class="sub">У каждого вида свой стиль боя. Выбор определит начальные характеристики.</p><div class="crab-art">🦀</div><div class="choices">'+state.crabs.map(c=>'<button class="choice" onclick="chooseCrab('+c.id+')"><span class="symbol">'+(['🦀','🦞','🦐'][c.id-1]||'🦀')+'</span><span><b>'+esc(c.name)+'</b><small>'+esc(c.desc)+'</small></span></button>').join('')+'</div></section><div class="footer">Профиль привязан к твоему Telegram</div>';
  return;
 }
 const s=stats(),inBattle=!!state.in_hunt,b=state.battle;
 app.innerHTML=head+
 '<section class="panel hero"><div class="hero-head"><div><div class="eyebrow">'+esc(state.zone)+'</div><div class="name">'+greeting+'</div><div class="sub">'+esc(state.crab_name)+' · уровень '+num(state.crab_level)+'</div></div><div class="rank">'+esc(state.rank)+'</div></div><div class="crab-art">'+(['🦀','🦞','🦐'][Number(state.crab_type)-1]||'🦀')+'</div><div class="stats"><div class="stat"><span>💰 Золото</span><b>'+num(state.gold)+'</b></div><div class="stat"><span>🧬 ДНК</span><b>'+num(state.dna_points)+'</b></div><div class="stat"><span>🐚 Раковины</span><b>'+num(state.shells)+'</b></div></div><div class="stats"><div class="stat"><span>🌊 Рекорд</span><b>'+num(state.max_meters)+' м</b></div><div class="stat"><span>☠️ Убийства</span><b>'+num(state.kills)+'</b></div><div class="stat"><span>🦋 Линьки</span><b>'+num(state.molts)+'</b></div></div></section>'+
 (inBattle&&b?'<section class="panel battle"><div class="eyebrow">Сражение · '+num(b.meters)+' м</div><div class="section-title">'+esc(b.name)+'</div><div class="monster">🐙</div><div class="sub">Здоровье врага · '+num(b.hp)+' / '+num(b.max_hp)+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,100*b.hp/Math.max(1,b.max_hp)))+'%"></i></div>'+(lastLog?'<div class="log">'+esc(lastLog)+'</div>':'')+'<div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="battleAbility(\'shield\')">🛡️ Панцирь · блок</button><button class="btn secondary" onclick="battleAbility(\'unique\')">'+esc(state.unique?.name||'🌟 Уникальная')+'</button></div>'+(extraData?.nectar?.active_nectar&&Number(extraData.nectar.nectars_inv?.[extraData.nectar.active_nectar]||0)>0?'<div class="actions" style="margin-top:10px"><button class="btn gold" onclick="battleAbility(&quot;nectar&quot;)">🍯 Нектар</button></div>':'')+'</section>':'')+
 '<section class="panel"><div class="section-title">'+(inBattle?'⚔️ Продолжить бой':'🌊 Исследовать глубины')+'</div><div class="actions"><button class="btn" onclick="hunt()" '+(busy?'disabled':'')+'>'+(inBattle?'✂️ Атаковать':'🔎 Выйти на охоту')+'</button><button class="btn gold" onclick="levelUp()" '+(busy||state.gold<state.level_cost?'disabled':'')+'>⬆️ +1 уровень<br><small style="font-size:11px;font-weight:600">Цена: '+num(state.level_cost)+' 💰</small></button></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="levelUpMax()">⬆️ Повысить максимально за доступное золото</button><div class="sub" style="margin-top:13px">⚔️ Урон '+num(s.damage)+' · 🌊 Уклонение '+num(s.evasion)+'% · 🎯 Крит '+num(s.crit)+'%</div></section>'+
 '<section class="panel"><div class="section-title">📍 Путь по бездне</div><div class="eyebrow">Текущая глубина</div><div class="name">'+num(state.cur_meters)+' м</div><div class="sub">Рекорд: '+num(state.max_meters)+' м</div><div class="bar"><i style="width:'+Math.min(100,state.max_meters/50)+'%"></i></div></section>'+
 '<div class="footer">CRAB RPG · Сохранение в PostgreSQL · Telegram Mini App</div>';
}
async function refresh(){try{state=await api('/api/state');await loadExtra();render()}catch(e){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">'+(!initData?'Открой приложение через кнопку Web App внутри Telegram. Прямая ссылка в браузере не передаёт данные авторизации.':esc(e.message))+'</div></div>'}}
async function action(fn){if(busy)return;busy=true;render();try{await fn()}catch(e){toast(e.message)}finally{busy=false;await refresh()}}
window.chooseCrab=id=>action(async()=>{state=await api('/api/choose-crab','POST',{crab_type:id});toast('Краб выбран! Путь начинается.')});
window.levelUp=()=>action(async()=>{const r=await api('/api/level-up','POST',{});state=r.state;toast('Уровень повышен!')});
window.levelUpMax=()=>action(async()=>{const r=await api('/api/level-up/max','POST',{});state=r.state;toast('Повышено на '+r.levels+' уровней за '+num(r.cost)+' золота')});
window.battleAbility=a=>action(async()=>{const r=await api('/api/hunt','POST',{action:a==='nectar'?'nectar':'ability',ability:a});state=r.state;lastLog=r.log||'Способность активирована';toast(lastLog)});
window.battleAbility=a=>action(async()=>{const r=await api('/api/hunt','POST',{action:'ability',ability:a});state=r.state;lastLog=r.log||'Способность активирована';toast(lastLog)});
window.hunt=()=>action(async()=>{const r=await api('/api/hunt','POST',{});state=r.state;lastLog=r.log|| (r.event==='started'?'Враг появился. Атакуй!':'');toast(r.event==='started'?'Противник обнаружен!':(r.log||'Готово'))});

let currentView='home', extraData=null, playerData=null;
const renderHomeBase=render;
function nav(){
 return '<nav class="appnav">'+[['home','🏠','Главная'],['inventory','🎒','Нора'],['dig','⛏️','Копать'],['mutations','🧬','Мутации'],['craft','🍯','Нектар'],['more','☰','Ещё']].map(([k,e,t])=>'<button class="'+(currentView===k?'active':'')+'" onclick="goView(\''+k+'\')"><span>'+e+'</span>'+t+'</button>').join('')+'</nav>';
}
async function loadExtra(){try{extraData=await api('/api/game-data')}catch(e){toast(e.message)}}
function renderSection(){
 if(!state||!state.registered||state.needs_crab){renderHomeBase();app.insertAdjacentHTML('beforeend',nav());return}
 const x=extraData||{stones:[],resources:[],mutations:[],chests:[],nectar:{},nectars:[],dig:{},evolution:{nodes:{},tree:[]}};
 let title='',body='';
 if(currentView==='inventory'){
  title='🎒 Нора';
  body='<div class="stats"><div class="stat"><span>💰 Золото</span><b>'+num(state.gold)+'</b></div><div class="stat"><span>🧬 ДНК</span><b>'+num(state.dna_points)+'</b></div><div class="stat"><span>🐚 Раковины</span><b>'+num(state.shells)+'</b></div></div><h3>💎 Камни</h3>'+ (x.stones.length?x.stones.map(s=>'<div class="rowitem"><b>'+esc(s.color_name)+' · ур. '+s.level+'</b><span>×'+num(s.count)+'</span></div>').join(''):'<p class="sub">Камней пока нет — отправь краба копать.</p>')+'<h3>📦 Ресурсы</h3>'+x.resources.map(s=>'<div class="rowitem"><b>'+esc(s.name)+'</b><span>×'+num(s.count)+'</span></div>').join('')+'<h3>🎁 Сундуки</h3>'+ (x.chests.length?x.chests.map(s=>'<div class="rowitem"><b>'+esc(s.name)+'</b><span>×'+num(s.count)+' <button onclick="openChest(\''+s.key+'\')">Открыть</button></span></div>').join(''):'<p class="sub">Сундуков нет.</p>')+'<h3>🧪 Мутации в коллекции</h3>'+ (x.mutations.length?x.mutations.map(m=>'<div class="rowitem"><b>'+esc(m.name)+' · ур. '+m.level+'</b><span>'+(m.equipped?'Надето':'В коллекции')+'</span></div>').join(''):'<p class="sub">Мутаций пока нет.</p>');
 }else if(currentView==='dig'){
  title='⛏️ Копание';
  const d=x.dig||{}, started=Number(d.start||0),duration=Number(d.duration||0),left=Math.max(0,duration-(Math.floor(Date.now()/1000)-started));
  body=started? (left>0?'<div class="notice">Краб копает дно. Осталось примерно '+Math.ceil(left/60)+' минут.</div>':'<div class="notice">🎁 Копание завершено! Можно забрать добычу.</div><button class="btn gold" onclick="digCollect()">Забрать добычу</button>') :'<p class="sub">Выбери продолжительность экспедиции. Камни и ресурсы будут добавлены в инвентарь после сбора.</p><div class="choices">'+(d.hours||[2,4,16,24]).map(h=>'<button class="choice" onclick="digStart('+h+')"><span class="symbol">⛏️</span><span><b>'+h+' часов</b><small>Отправить краба добывать материалы</small></span></button>').join('')+'</div>';
 }else if(currentView==='mutations'){
  title='🧬 Лаборатория мутаций';
  const owned=new Set(x.mutations.map(m=>m.key));
  const passive=(x.catalog||[]);
  body='<div class="sub">ДНК: '+num(state.dna_points)+' · Пассивные мутации работают постоянно. Активные занимают слоты.</div><h3>Мои мутации</h3>'+(x.mutations.length?x.mutations.map(m=>'<div class="rowitem"><b>'+esc(m.name)+' · ур. '+m.level+'</b><span>'+(m.active?(m.equipped?'<button onclick="mutAction(\'unequip\',\''+m.key+'\')">Снять</button>':'<button onclick="mutAction(\'equip\',\''+m.key+'\')">Надеть</button>'):'Пассивная')+' <button onclick="mutAction(\'upgrade\',\''+m.key+'\')">Улучшить</button></span></div>').join(''):'<p class="sub">Пока пусто.</p>')+'<h3>Открыть пассивные</h3>'+(x.passiveShop||[]).map(m=>'<div class="rowitem"><b>'+esc(m.name)+'</b><span>'+(owned.has(m.key)?'Есть':'<button onclick="mutAction(\'buy\',\''+m.key+'\')">Купить · '+num(m.cost)+' 🧬</button>')+'</span></div>').join('');
 }else if(currentView==='craft'){
  title='🍯 Лаборатория нектаров';
  const nectar=x.nectar||{}, inv=nectar.nectars_inv||{};
  body='<div class="sub">Надето: '+esc((x.nectars.find(n=>n.key===nectar.active_nectar)||{}).name||'ничего')+'</div>'+(nectar.active_nectar?'<button class="btn secondary" onclick="nectarAction(\'equip\',\'\')">Снять нектар</button>':'')+(x.nectars||[]).map(n=>'<div class="rowitem"><div><b>'+esc(n.name)+'</b><div class="sub">'+esc(n.desc)+'</div><small>В запасе: '+num(n.count)+'</small></div><span><button onclick="nectarAction(\'craft\',\''+n.key+'\')">Крафт</button>'+(n.count?'<button onclick="nectarAction(\'equip\',\''+n.key+'\')">Надеть</button>':'')+'</span></div>').join('');
 }else if(currentView==='more'){
  title='☰ Дополнительно';
  body='<button class="choice" onclick="searchPlayer()"><span class="symbol">🔍</span><span><b>Найти игрока</b><small>Посмотреть открытый профиль</small></span></button><button class="choice" onclick="randomPlayers()"><span class="symbol">🎲</span><span><b>Случайные игроки</b><small>Найти новых исследователей</small></span></button><button class="choice" onclick="goView(\'shop\')"><span class="symbol">🛍️</span><span><b>Магазин</b><small>Покупки за раковины и Stars</small></span></button><button class="choice" onclick="redeemPromo()"><span class="symbol">🎟️</span><span><b>Промокод</b><small>Активировать код</small></span></button><button class="choice" onclick="goView(\'evolution\')"><span class="symbol">🌟</span><span><b>Эволюция</b><small>Выбор постоянных бонусов до линьки</small></span></button><button class="choice" onclick="goView(\'leaderboard\')"><span class="symbol">🏆</span><span><b>Топ игроков</b><small>Рейтинг глубины и линек</small></span></button><button class="choice" onclick="goView(\'stats\')"><span class="symbol">📊</span><span><b>Статистика</b><small>Твои игровые достижения</small></span></button><button class="choice" onclick="changeNickname()"><span class="symbol">✏️</span><span><b>Изменить ник</b><small>Один раз в 7 дней</small></span></button><button class="choice" onclick="goView(\'events\')"><span class="symbol">🐉</span><span><b>Мифические события</b><small>Боссы и общий рейтинг урона</small></span></button>'+(state.is_admin?'<button class="choice" onclick="goView(\'admin\')"><span class="symbol">🛠️</span><span><b>Админ-панель</b><small>Управление игроками и промокодами</small></span></button>':'');
 }else if(currentView==='admin'){
  title='🛠️ Админ-панель';
  if(!state.is_admin){currentView='more';title='☰ Дополнительно';body='<p class="notice">Доступ запрещён.</p>'}
  else body='<div class="notice">Права владельца подтверждаются сервером. Выдачи и промокоды сохраняются в PostgreSQL.</div><h3>🎁 Выдать награду</h3><button class="btn" onclick="adminGrantCurrency()">Выдать / списать валюту</button><button class="btn secondary" onclick="adminGrantItem()">Выдать предмет</button><h3>🎟️ Промокоды</h3><button class="btn gold" onclick="adminCreatePromo()">Создать промокод</button><button class="btn secondary" onclick="loadAdminPromos()">Обновить список</button><div id="adminpromos" class="sub">Нажми «Обновить список»</div>';
 }else if(currentView==='evolution'){
  title='🌟 Древо эволюции';
  const evo=x.evolution||{},tree=evo.tree||[],nodes=evo.nodes||{};
  body='<div class="sub">Этап '+num(evo.stage||0)+' · доступно '+Math.max(0,Math.min(10,Math.floor(state.crab_level/50))-Number(evo.stage||0))+' очков</div>'+Object.entries(nodes).filter(([k,n])=>k.startsWith(x.crystal||'')&&!tree.includes(k)).map(([k,n])=>'<div class="rowitem"><b>'+esc(n.name)+'<div class="sub">'+esc(n.desc)+'</div></b><button onclick="evolutionPick(\''+k+'\')">Выбрать</button></div>').join('');
 }else if(currentView==='leaderboard'){
  title='🏆 Топ игроков';
  body='<div class="loading">Загрузка рейтинга…</div>'; loadLeaderboard();


 }else if(currentView==='random'){
  title='🎲 Случайные игроки';
  body='<div id="randombox" class="sub">Ищем игроков…</div>';loadRandomPlayers();
 }else if(currentView==='player'){
  title='🔍 Профиль игрока';
  body=playerData?'<div class="name">'+esc(playerData.nickname)+'</div><div class="sub">'+esc(playerData.rank)+' · '+esc(playerData.crab)+'</div><div class="stats"><div class="stat"><span>Уровень</span><b>'+num(playerData.level)+'</b></div><div class="stat"><span>Линьки</span><b>'+num(playerData.molts)+'</b></div><div class="stat"><span>Глубина</span><b>'+num(playerData.meters)+' м</b></div></div><div class="rowitem"><b>Урон</b><span>'+num(playerData.damage)+'</span></div><div class="rowitem"><b>Макс. HP</b><span>'+num(playerData.hp)+'</span></div><div class="rowitem"><b>Убийства</b><span>'+num(playerData.kills)+'</span></div><div class="rowitem"><b>Боссы</b><span>'+num(playerData.boss_kills)+'</span></div><h3>Экипированные мутации</h3>'+((playerData.equipped||[]).length?playerData.equipped.map(n=>'<div class="rowitem"><b>'+esc(n)+'</b></div>').join(''):'<p class="sub">Нет активных мутаций</p>'):'<p class="sub">Игрок не найден</p>';
 }else if(currentView==='stats'){
  title='📊 Статистика';
  const s=x.stats||{};
  body='<div class="rowitem"><b>Всего заработано золота</b><span>'+num(s.total_gold)+'</span></div><div class="rowitem"><b>Всего ДНК получено</b><span>'+num(s.total_dna)+'</span></div><div class="rowitem"><b>Убито существ</b><span>'+num(s.kills)+'</span></div><div class="rowitem"><b>Убито боссов</b><span>'+num(s.boss_kills)+'</span></div><div class="rowitem"><b>Линьки</b><span>'+num(state.molts)+'</span></div><div class="rowitem"><b>Рекорд глубины</b><span>'+num(state.max_meters)+' м</span></div>';
 }else if(currentView==='events'){
  title='🐉 Мифические события';
  body='<div class="notice">Линька доступна с 100 уровня. Она сбрасывает уровень, золото и эволюцию, но даёт ДНК. Это действие необратимо.</div><button class="btn gold" onclick="molt()" '+(state.crab_level<100?'disabled':'')+'>🦋 Провести линьку</button><div id="eventsbox" class="sub" style="margin-top:16px">Загружаем событие…</div>'; loadEvents();
 }
 app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><button class="avatar" onclick="goView(\'home\')">🦀</button></div><section class="panel"><div class="section-title">'+title+'</div>'+body+'</section>'+nav();
}
render=function(){if(currentView==='home'){renderHomeBase();app.insertAdjacentHTML('beforeend',nav())}else renderSection()};


let shopData=null;
async function loadShop(){try{shopData=await api('/api/shop');if(currentView==='shop')renderShop()}catch(e){toast(e.message)}}
function renderShop(){const el=app.querySelector('.panel');if(!el||currentView!=='shop')return;el.innerHTML='<div class="section-title">🛍️ Магазин</div><div class="sub">Твои раковины: '+num(shopData.shells)+' 🐚</div><h3>За раковины</h3>'+shopData.shell_items.map(i=>'<div class="rowitem"><b>'+esc(i.title)+'<div class="sub">Цена: '+i.shells+' 🐚</div></b><button onclick="buyShell(\''+i.key+'\')">Купить</button></div>').join('')+'<h3>За Telegram Stars</h3>'+shopData.stars_items.map(i=>'<div class="rowitem"><b>'+esc(i.title)+'<div class="sub">'+esc(i.description)+'</div></b><span>'+i.stars+' ⭐ <button onclick="buyStars(\''+i.key+'\')">Купить</button></span></div>').join('')}
window.buyStars=k=>action(async()=>{const r=await api('/api/shop/invoice','POST',{key:k});if(!tg?.openInvoice)throw new Error('Telegram invoice UI unavailable');tg.openInvoice(r.url,status=>{if(status==='paid'){toast('Платёж прошёл!');setTimeout(()=>refresh(),1500)}else if(status==='failed')toast('Платёж не прошёл');else if(status==='cancelled')toast('Покупка отменена')})});
window.buyShell=k=>action(async()=>{const r=await api('/api/shop/shell','POST',{key:k});await loadExtra();await loadShop();toast(r.message)});
window.openChest=k=>action(async()=>{const r=await api('/api/chest/open','POST',{key:k});await loadExtra();toast('Сундук открыт! Раковины: '+r.loot.shells+', камней: '+r.loot.stones.length+(r.loot.mutation?' · мутация получена':''))});
window.redeemPromo=()=>{const code=prompt('Введи промокод:');if(code)action(async()=>{const r=await api('/api/promo','POST',{code});await refresh();toast('Промокод активирован!')})};

window.molt=()=>{if(!confirm('Линька сбросит уровень, золото и эволюцию. Продолжить?'))return;action(async()=>{const r=await api('/api/molt','POST',{});state=r.state;currentView='home';await loadExtra();toast('Линька завершена! Получено '+num(r.dna)+' ДНК')})};
async function loadEvents(){try{const r=await api('/api/events');const el=document.getElementById('eventsbox');if(!el)return;if(!r.unlocked){el.innerHTML='<h3>🐉 Ивенты закрыты</h3><p>Нужно выполнить хотя бы одно условие: '+r.requirements.molts+' линьки, рекорд '+r.requirements.meters+' м или '+r.requirements.kills+' убийств.</p>';return}if(!r.event){el.innerHTML='<h3>🌊 Активных ивентов нет</h3><p>События запускаются автоматически. Загляни позже.</p>';return}el.innerHTML='<h3>'+esc(r.event.name)+'</h3><p>'+esc(r.event.description)+'</p><h3>Урон игроков</h3>'+r.event.leaderboard.map((p,i)=>'<div class="rowitem"><b>#'+(i+1)+' '+esc(p.nickname)+'</b><span>'+num(p.damage)+'</span></div>').join('')}catch(e){toast(e.message)}}


window.adminGrantCurrency=()=>{const id=prompt('Telegram ID игрока:');if(!id)return;const currency=prompt('Валюта: gold (золото), dna_points (ДНК), nautilus_shells (раковины)');if(!currency)return;const amount=prompt('Количество: положительное — выдать, отрицательное — списать');if(!amount)return;action(async()=>{const r=await api('/api/admin/grant','POST',{kind:'currency',user_id:id,currency,amount:Number(amount)});toast('Игрок '+r.player+': '+r.amount+' '+r.kind);await refresh()})};
window.adminGrantItem=()=>{const id=prompt('Telegram ID игрока:');if(!id)return;const type=prompt('Тип предмета: chest, resource, stone, mutation, nectar');if(!type)return;const key=prompt('Ключ предмета (камень: color:level, например blue:1)');if(!key)return;const amount=prompt('Количество');if(!amount)return;action(async()=>{const r=await api('/api/admin/grant','POST',{kind:'item',user_id:id,item_type:type,item_key:key,amount:Number(amount)});toast('Предмет выдан игроку '+r.player);await refresh()})};
window.adminCreatePromo=()=>{const code=prompt('Код промокода (латиница/цифры/_/-):');if(!code)return;const gold=Number(prompt('Золото (0 если не нужно)','0')||0),dna=Number(prompt('ДНК (0 если не нужно)','0')||0),shells=Number(prompt('Раковины (0 если не нужно)','0')||0);const type=prompt('Тип предмета: chest, resource, stone, mutation, nectar. Оставь пустым, если только валюта.','');let item_key='',item_count=0;if(type){item_key=prompt('Ключ предмета (stone: color:level, например blue:1)');item_count=Number(prompt('Количество предмета','1')||0)}const max_uses=Number(prompt('Общий лимит активаций (0 = без лимита)','0')||0),expires_hours=Number(prompt('Срок действия в часах (0 = бессрочно)','0')||0);action(async()=>{await api('/api/admin/promos','POST',{code,gold,dna,shells,item_type:type||'',item_key,item_count,max_uses,expires_hours});toast('Промокод '+code+' создан');loadAdminPromos()})};
window.loadAdminPromos=async()=>{try{const r=await api('/api/admin/promos');const el=document.getElementById('adminpromos');if(!el)return;el.innerHTML=r.promos.length?r.promos.map(p=>'<div class="rowitem"><div><b>'+esc(p.code)+'</b><div class="sub">Использовано '+p.used_count+(p.max_uses?' / '+p.max_uses:' / ∞')+' · '+esc(JSON.stringify(p.rewards))+'</div></div>'+(p.active?'<button class="btn secondary" onclick="adminDisablePromo(\''+esc(p.code)+'\')">Отключить</button>':'<span>Отключён</span>')+'</div>').join(''):'<p>Промокодов пока нет.</p>'}catch(e){toast(e.message)}};
window.adminDisablePromo=code=>action(async()=>{await api('/api/admin/promos/disable','POST',{code});toast('Промокод отключён');loadAdminPromos()});

window.goView=async v=>{if(v==='admin'&&!state.is_admin){toast('Доступ запрещён');return;}currentView=v;if(v==='home'){render();return}await loadExtra();render();if(v==='shop')await loadShop()};
window.digStart=h=>action(async()=>{await api('/api/dig/start','POST',{hours:h});await loadExtra();toast('Краб отправлен копать!')});
window.digCollect=()=>action(async()=>{const r=await api('/api/dig/collect','POST',{});await loadExtra();toast('Добыча собрана: '+r.stones.length+' камней, '+r.resources.length+' ресурсов')});
window.mutAction=(a,k)=>action(async()=>{const r=await api('/api/mutations/action','POST',{action:a,key:k});await loadExtra();toast(a==='buy'?'Мутация приобретена!':a==='upgrade'?'Мутация улучшена!':'Экипировка обновлена')});
window.nectarAction=(a,k)=>action(async()=>{await api('/api/nectar/action','POST',{action:a,key:k});await loadExtra();toast(a==='craft'?'Нектар создан!':'Нектар экипирован')});
window.evolutionPick=k=>action(async()=>{await api('/api/evolution/pick','POST',{key:k});await loadExtra();toast('Эволюция выбрана!')});

async function loadRandomPlayers(){try{const r=await api('/api/players/random');const el=document.getElementById('randombox');if(el)el.innerHTML=r.players.map(p=>'<div class="rowitem"><b>'+esc(p.nickname)+'<div class="sub">'+p.level+' ур. · '+p.molts+' линек · '+esc(p.zone)+'</div></b><button onclick="viewPlayer('+JSON.stringify(p.nickname)+')">Профиль</button></div>').join('')}catch(e){toast(e.message)}}
window.randomPlayers=async()=>{currentView='random';await loadExtra();render()};
window.viewPlayer=async n=>{try{playerData=await api('/api/player/search','POST',{nickname:n});currentView='player';await loadExtra();render()}catch(e){toast(e.message)}};

window.searchPlayer=async()=>{const name=prompt('Ник игрока:');if(!name)return;try{playerData=await api('/api/player/search','POST',{nickname:name});currentView='player';await loadExtra();render()}catch(e){toast(e.message)}};
window.changeNickname=()=>{const n=prompt('Новый ник (3–16 символов):',state.nickname);if(n)action(async()=>{await api('/api/nickname','POST',{nickname:n});await refresh();toast('Ник изменён')})};
async function loadLeaderboard(){try{const r=await api('/api/leaderboard');if(currentView==='leaderboard'){const p=app.querySelector('.panel');p.innerHTML='<div class="section-title">🏆 Топ игроков</div>'+r.players.map(x=>'<div class="rowitem"><b>#'+x.rank+' '+esc(x.nickname)+'<div class="sub">'+x.level+' ур. · '+x.molts+' линек · '+esc(x.zone)+'</div></b><span>'+num(x.meters)+' м</span></div>').join('')}}catch(e){toast(e.message)}}

if(!initData){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">Чтобы открыть игру, запусти Crab RPG в Telegram и нажми кнопку Web App. Внешний браузер не передаёт Telegram initData.</div></div>'}else refresh();
})();
</script>
</body>
</html>
