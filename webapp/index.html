<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>Crab RPG · Abyss</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#040a13;--surface:#0a1724;--surface-hi:#102536;--stroke:#214456;--aqua:#70f1dc;--ice:#79c9f4;--gold:#efc477;--white:#effaff;--dim:#89a7b8;--danger:#ff8b91}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) 14px calc(96px + env(safe-area-inset-bottom));font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white);background:radial-gradient(ellipse 100% 40% at 50% -8%,#164456 0%,#0a2636 36%,transparent 76%),radial-gradient(ellipse 65% 50% at 100% 55%,#123b4a30,transparent 72%),linear-gradient(180deg,#061522 0%,#040a13 70%,#02060c 100%);letter-spacing:.01em}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.23;background-image:radial-gradient(circle,#80f3e9 0 1px,transparent 1.8px),radial-gradient(circle,#7bbce8 0 1px,transparent 2px);background-size:173px 217px,263px 311px;background-position:19px 28px,91px 112px;animation:driftDeep 28s linear infinite}
main{max-width:560px;margin:0 auto;padding:0 1px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 5px 20px}
.brand{font-size:9px;letter-spacing:4px;font-weight:800;color:#8bece1;text-shadow:0 0 20px #51d9c44d}
.brand strong{display:block;margin-top:4px;font-size:28px;line-height:1;letter-spacing:1px;font-weight:950;color:#f5fcff;text-shadow:0 5px 24px #0008}
.avatar{display:grid;place-items:center;width:50px;height:50px;border-radius:17px;font-size:27px;background:linear-gradient(145deg,#1b4c5d,#0b1b2a);border:1px solid #5ac6c47a;box-shadow:inset 0 1px #ffffff20,0 10px 28px #0006,0 0 28px #2bd0c51b}
.panel{position:relative;isolation:isolate;overflow:hidden;margin:13px 0 16px;padding:20px;border:1px solid #285267;border-radius:25px;background:linear-gradient(145deg,#0c2131f5 0%,#081421f8 72%);box-shadow:inset 0 1px #ffffff0c,0 15px 40px #0005,0 0 24px #32c7c20c;backdrop-filter:blur(16px)}
.panel:before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;z-index:-1;background:linear-gradient(90deg,transparent,#84f4e3aa,transparent)}
.panel:after{content:"";position:absolute;z-index:-1;right:-82px;top:-110px;width:205px;height:205px;border:1px solid #6de5d716;border-radius:50%;box-shadow:0 0 0 22px #6de5d708,0 0 0 46px #6de5d704;pointer-events:none}
.hero{padding:22px;border-color:#36708277;background:radial-gradient(ellipse at 83% 18%,#2d8d9840,transparent 43%),linear-gradient(145deg,#102b3e 0%,#081522 72%);box-shadow:inset 0 1px #ffffff18,0 18px 48px #0006,0 0 30px #36c9c31a}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
.eyebrow{font-size:9px;line-height:1.4;text-transform:uppercase;letter-spacing:2.3px;font-weight:850;color:#83d8d7}
.name{font-size:26px;line-height:1.05;font-weight:900;letter-spacing:-.9px;margin:8px 0;color:#f4fbff;text-shadow:0 4px 18px #0005}
.rank{white-space:nowrap;padding:7px 10px;border-radius:10px;font-size:9px;letter-spacing:.7px;font-weight:900;color:#f5d58e;background:linear-gradient(145deg,#5a472d66,#211b14);border:1px solid #c99e5b70;box-shadow:inset 0 1px #ffffff16}
.crab-art{height:164px;position:relative;isolation:isolate;display:grid;place-items:center;margin:5px -6px 3px;font-size:94px;filter:drop-shadow(0 13px 21px #3ad9db45);animation:crabHover 4s ease-in-out infinite}
.crab-art:before{content:"";position:absolute;z-index:-1;width:150px;height:150px;border-radius:50%;border:1px solid #80f4e529;background:radial-gradient(circle,#45d7d72e 0%,#2c9bbd0d 57%,transparent 74%);box-shadow:0 0 55px #29b8c51a,inset 0 0 32px #6cece510}
.crab-art:after{content:"";position:absolute;z-index:-1;width:212px;height:212px;border-radius:50%;border:1px dashed #73e6e51e;animation:spinAbyss 38s linear infinite}
.sub{font-size:12px;line-height:1.55;color:#9ab7c7}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{min-width:0;padding:12px 10px;border-radius:15px;border:1px solid #25495b;background:linear-gradient(145deg,#0a1b29,#07131f);box-shadow:inset 0 1px #ffffff09}
.stat span{display:block;font-size:9px;line-height:1.3;color:#8aafbf;letter-spacing:.25px}
.stat b{display:block;margin-top:7px;font-size:18px;line-height:1.1;font-weight:900;color:#e9fbff;overflow-wrap:anywhere}
.section-title{font-size:17px;line-height:1.25;font-weight:900;letter-spacing:-.25px;margin:2px 0 16px;color:#effaff}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.btn{min-height:48px;border:1px solid #7df2df33;border-radius:15px;padding:13px 12px;font-size:12px;line-height:1.3;font-weight:850;letter-spacing:.1px;color:#05212a;background:linear-gradient(135deg,#9bf5df 0%,#4eb9d8 100%);box-shadow:0 7px 24px #27b9bd22,inset 0 1px #ffffffa0;cursor:pointer;transition:transform .16s,filter .16s}
.btn:active,.choice:active{transform:scale(.98);filter:brightness(1.1)}
.btn.secondary{color:#e8f9ff;background:linear-gradient(145deg,#17394c,#0b2030);border:1px solid #3a6479;box-shadow:inset 0 1px #ffffff0b}
.btn.gold{color:#34230b;background:linear-gradient(135deg,#f8e1a5,#d6a44d);border:1px solid #ffdf9b80;box-shadow:0 7px 23px #c895381a,inset 0 1px #ffffffa0}
.btn:disabled{opacity:.4;filter:grayscale(.5);box-shadow:none}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px;border-radius:18px;color:var(--white);background:linear-gradient(145deg,#102a3b,#081724);border:1px solid #285267;box-shadow:inset 0 1px #ffffff0a,0 8px 24px #0002;cursor:pointer;transition:border-color .18s,transform .18s}
.choice:hover{border-color:#5fc8c6aa}
.choice .symbol{display:grid;place-items:center;flex:0 0 43px;width:43px;height:43px;border-radius:14px;font-size:24px;background:linear-gradient(145deg,#1b4a5d,#0a2030);border:1px solid #477c8a66}
.choice b{display:block;margin-bottom:5px;font-size:13px;font-weight:850;color:#edfaff}
.choice small{display:block;font-size:11px;line-height:1.45;color:#93b1c2}
.bar{height:9px;margin-top:12px;overflow:hidden;border-radius:10px;background:#020b13;border:1px solid #1b4051}
.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#32a9ce,#78f2d9);box-shadow:0 0 14px #44d9ce55}
.battle{background:radial-gradient(ellipse at top,#552b3c66,transparent 58%),linear-gradient(145deg,#251a2b,#0b1725);border-color:#9c5c6a77}
.monster{margin:13px;text-align:center;font-size:58px;filter:drop-shadow(0 8px 17px #f2766540)}
.battle .bar i{background:linear-gradient(90deg,#f26367,#ffc276);box-shadow:0 0 12px #f2636755}
.log{margin-top:13px;padding:12px;border-radius:14px;border:1px solid #3b4c5a;background:#06121dbb;font-size:12px;line-height:1.65;color:#c9dce6}
.notice{padding:16px;border-radius:17px;color:#f6dca5;background:linear-gradient(145deg,#30271a,#191610);border:1px solid #81683b;font-size:13px;line-height:1.55}
.rowitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #1e4052;font-size:12px}
.rowitem:last-child{border-bottom:0}
.rowitem span{white-space:nowrap}
.rowitem button{padding:8px 10px;border-radius:10px;color:#e5fbff;background:linear-gradient(145deg,#174157,#0b2637);border:1px solid #3c7186;font-size:11px;font-weight:800}
.panel h3{margin:22px 0 9px;color:#82e7dd;font-size:13px;letter-spacing:.35px}
input,select,textarea{max-width:100%;padding:12px!important;background:#071724!important;color:#eafaff!important;border:1px solid #2a5266!important;border-radius:13px!important;font:inherit!important}
.footer{text-align:center;padding:15px 5px;color:#5f8195;font-size:10px;letter-spacing:.3px}
.loading{padding:70px 0;text-align:center;color:#8cb4c4;font-size:12px}
.spinner{display:inline-block;width:30px;height:30px;margin-bottom:13px;border:3px solid #1a4053;border-top-color:#7af0df;border-radius:50%;box-shadow:0 0 18px #38cfcf22;animation:spin .8s linear infinite}
.appnav{position:fixed;z-index:8;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:4px;padding:9px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#091a29f0,#030a12fc);border-top:1px solid #285164a8;backdrop-filter:blur(22px);box-shadow:0 -12px 35px #0006}
.appnav button{display:flex;flex:1;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:6px 3px;border:0;border-radius:12px;background:transparent;color:#7797a9;font-size:9px;font-weight:800;letter-spacing:.15px}
.appnav button span{font-size:20px;filter:saturate(.85)}
.appnav button.active{color:#7ef0df;background:linear-gradient(180deg,#1a4b5533,transparent);text-shadow:0 0 16px #54d9d555}
.toast{position:fixed;z-index:20;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:auto;padding:14px 16px;border:1px solid #4d8b9d;border-radius:16px;background:linear-gradient(145deg,#14374b,#071925);color:white;font-size:13px;box-shadow:0 14px 35px #0008,0 0 25px #3bd8d018}
@keyframes crabHover{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes spinAbyss{to{transform:rotate(360deg)}}
@keyframes driftDeep{to{background-position:0 -430px,0 520px}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:520px){main{padding:0 7px}.panel{padding:23px}.hero{padding:25px}}
@media(max-width:360px){body{padding-left:10px;padding-right:10px}.panel{padding:15px}.hero{padding:17px}.stats{gap:6px}.stat{padding:10px 7px}.stat b{font-size:16px}.appnav button{font-size:8px}.appnav button span{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

<body>
<main id="app"><div class="loading"><div class="spinner"></div><div>Погружаемся в бездну…</div></div></main>
<script>
(() => {
const tg=window.Telegram?.WebApp;
const app=document.getElementById('app');
let state=null, busy=false, lastLog='';
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#071522');tg.setBackgroundColor('#071522');tg.enableClosingConfirmation();}catch(e){}}
const initData=tg?.initData||'';
const user=tg?.initDataUnsafe?.user||{};
const num=n=>Number(n||0).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
async function api(path,method='GET',body=null){
 const res=await fetch(path,{method,headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(!res.ok){let msg='Не удалось выполнить действие';try{msg=await res.text()}catch(e){};throw new Error(msg)}
 return res.json();
}
function stats(){return state?.stats||{}}
function render(){
 if(!state){app.innerHTML='<div class="loading">Не удалось загрузить игру</div>';return}
 if(!state.registered){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">Профиль не найден. Нажми /start в боте, затем снова открой Web App.</div></div>';return}
 const greeting=esc(state.nickname||user.first_name||'Путник');
 const crabVisual='<svg class="crab-svg" viewBox="0 0 160 160" aria-hidden="true"><defs><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4fff0"/><stop offset=".45" stop-color="#4ac7d1"/><stop offset="1" stop-color="#17648b"/></linearGradient><linearGradient id="claw" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9af6e1"/><stop offset="1" stop-color="#2487ad"/></linearGradient></defs><g fill="none" stroke="#73eadf" stroke-width="5" stroke-linecap="round"><path d="M48 82 24 64 15 43M112 82l24-18 9-21M48 100 24 112 15 132M112 100l24 12 9 20"/></g><g fill="url(#claw)" stroke="#b5fff0" stroke-width="2.5"><path d="M24 62C8 55 8 35 20 24c3 14 14 14 20 4 9 18-1 31-16 34Z"/><path d="M136 62c16-7 16-27 4-38-3 14-14 14-20 4-9 18 1 31 16 34Z"/><path d="M24 111c-16 7-16 27-4 38 3-14 14-14 20-4 9-18-1-31-16-34Z"/><path d="M136 111c16 7 16 27 4 38-3-14-14-14-20-4-9-18 1-31 16-34Z"/></g><path d="M38 77Q80 42 122 77L115 112Q80 139 45 112Z" fill="url(#shell)" stroke="#c1fff3" stroke-width="3"/><path d="M47 81Q80 58 113 81" fill="none" stroke="#e1fff7" stroke-width="3" opacity=".75"/><g fill="#f5fffc" stroke="#174e70" stroke-width="4"><circle cx="62" cy="70" r="9"/><circle cx="98" cy="70" r="9"/></g><g fill="#09283c"><circle cx="64" cy="71" r="3.5"/><circle cx="96" cy="71" r="3.5"/></g><path d="M69 96q11 9 22 0" fill="none" stroke="#104b68" stroke-width="4" stroke-linecap="round"/><g fill="#7af1dd"><circle cx="80" cy="20" r="3"/><circle cx="130" cy="30" r="2"/><circle cx="30" cy="132" r="2"/></g></svg>';
 let head='<div class="top"><div class="brand"><span class="brand-mark">♆</span><span>CRAB RPG<strong>ABYSS</strong></span></div><div class="avatar">🦀</div></div>';
 if(state.needs_crab){
  app.innerHTML=head+'<section class="panel hero"><div class="eyebrow">Твоё путешествие начинается</div><div class="name">Выбери своего краба</div><p class="sub">У каждого вида свой стиль боя. Выбор определит начальные характеристики.</p><div class="crab-art">🦀</div><div class="choices">'+state.crabs.map(c=>'<button class="choice" onclick="chooseCrab('+c.id+')"><span class="symbol">'+(['🦀','🦞','🦐'][c.id-1]||'🦀')+'</span><span><b>'+esc(c.name)+'</b><small>'+esc(c.desc)+'</small></span></button>').join('')+'</div></section><div class="footer">Профиль привязан к твоему Telegram</div>';
  return;
 }
 const s=stats(),inBattle=!!state.in_hunt,b=state.battle;
 app.innerHTML=head+
 '<section class="panel hero"><div class="hero-head"><div><div class="eyebrow">'+esc(state.zone)+'</div><div class="name">'+greeting+'</div><div class="sub">'+esc(state.crab_name)+' · уровень '+num(state.crab_level)+'</div></div><div class="rank">'+esc(state.rank)+'</div></div><div class="crab-art relic-crab">'+crabVisual+'</div><div class="stats"><div class="stat"><span>💰 Золото</span><b>'+num(state.gold)+'</b></div><div class="stat"><span>🧬 ДНК</span><b>'+num(state.dna_points)+'</b></div><div class="stat"><span>🐚 Раковины</span><b>'+num(state.shells)+'</b></div></div><div class="stats"><div class="stat"><span>🌊 Рекорд</span><b>'+num(state.max_meters)+' м</b></div><div class="stat"><span>☠️ Убийства</span><b>'+num(state.kills)+'</b></div><div class="stat"><span>🦋 Линьки</span><b>'+num(state.molts)+'</b></div></div></section>'+
 (inBattle&&b?'<section class="panel battle"><div class="eyebrow">Сражение · '+num(b.meters)+' м</div><div class="section-title">'+esc(b.name)+'</div><div class="monster">🐙</div><div class="sub">Здоровье врага · '+num(b.hp)+' / '+num(b.max_hp)+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,100*b.hp/Math.max(1,b.max_hp)))+'%"></i></div>'+(lastLog?'<div class="log">'+esc(lastLog)+'</div>':'')+'<div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="battleAbility(\'shield\')">🛡️ Панцирь · блок</button><button class="btn secondary" onclick="battleAbility(\'unique\')">'+esc(state.unique?.name||'🌟 Уникальная')+'</button></div>'+(extraData?.nectar?.active_nectar&&Number(extraData.nectar.nectars_inv?.[extraData.nectar.active_nectar]||0)>0?'<div class="actions" style="margin-top:10px"><button class="btn gold" onclick="battleAbility(&quot;nectar&quot;)">🍯 Нектар</button></div>':'')+'</section>':'')+

function relicMount(){if(!state||!state.registered)return;const top=app.querySelector('.top');if(top&&!top.querySelector('.relic-top-tools')){const av=top.querySelector('.avatar');if(av)av.outerHTML='<div class="relic-top-tools"><button class="relic-icon-button" id="relicSettingsToggle" aria-label="Настройки">'+relicSvg('settings')+'<i></i></button></div>';}app.querySelectorAll('.appnav button').forEach((b,i)=>{const keys=['home','bag','pick','dna','nectar','menu'];const sp=b.querySelector('span');if(sp)sp.innerHTML=relicSvg(keys[i]||'menu')});const toolsTop=app.querySelector('.relic-top-tools');if(toolsTop&&!document.getElementById('relicDailyFloat'))toolsTop.insertAdjacentHTML('beforeend','<button class="relic-daily-float" id="relicDailyFloat" aria-label="Ежедневные награды">'+relicSvg('calendar')+'<span class="relic-float-count">31</span><small>Награды</small></button>');if(!document.getElementById('relicSettingsPanel'))document.body.insertAdjacentHTML('beforeend','<div class="relic-menu-backdrop" id="relicMenuBackdrop"></div><aside class="relic-settings-panel" id="relicSettingsPanel"><div class="relic-menu-head"><div><small>CRAB RPG · ABYSS</small><b>Управление</b></div><button class="relic-close" data-close-menu>'+relicSvg('close')+'</button></div><button class="relic-menu-item" data-action="shop"><span class="relic-menu-icon">'+relicSvg('shell')+'</span><span><b>Магазин и донат</b><small>Раковины · Telegram Stars</small></span><em>›</em></button><button class="relic-menu-item" data-action="promo"><span class="relic-menu-icon">'+relicSvg('crown')+'</span><span><b>Промокоды</b><small>Активировать бонус</small></span><em>›</em></button><button class="relic-menu-item" data-action="nickname"><span class="relic-menu-icon">'+relicSvg('dna')+'</span><span><b>Профиль</b><small>Имя игрока</small></span><em>›</em></button><button class="relic-menu-item" data-action="leaderboard"><span class="relic-menu-icon">'+relicSvg('crown')+'</span><span><b>Рейтинг</b><small>Исследователи бездны</small></span><em>›</em></button><button class="relic-menu-item" data-action="events"><span class="relic-menu-icon">'+relicSvg('chest')+'</span><span><b>События</b><small>Мифические боссы</small></span><em>›</em></button><button class="relic-menu-item" data-action="stats"><span class="relic-menu-icon">'+relicSvg('pick')+'</span><span><b>Статистика</b><small>Достижения</small></span><em>›</em></button><div class="relic-menu-footer"><span>Анимации интерфейса</span><button id="relicMotion" class="relic-switch"><i></i></button></div>'+(state.is_admin?'<button class="relic-menu-item" data-action="admin"><span class="relic-menu-icon">'+relicSvg('settings')+'</span><span><b>Админ-панель</b><small>Инструменты владельца</small></span><em>›</em></button>':'')+'</aside>');if(!document.getElementById('relicDailyModal'))document.body.insertAdjacentHTML('beforeend','<div class="relic-modal-backdrop" id="relicDailyModal"><section class="relic-daily-modal"><header class="relic-daily-header"><div><small>LOGIN REWARDS · 31 DAYS</small><h2>Календарь наград</h2><p id="relicDailySubtitle">Каждый день — новый трофей</p></div><button class="relic-close" data-close-daily>'+relicSvg('close')+'</button></header><div class="relic-daily-progress"><span id="relicDailyProgressText">0 / 31 дней</span><div class="relic-progress-track"><i id="relicDailyProgressBar"></i></div></div><div class="relic-calendar-grid" id="relicCalendarGrid"></div><div class="relic-daily-bottom"><div><small>Награда дня</small><b id="relicDailyRewardLabel">Открой календарь</b></div><button class="relic-claim-button" id="relicClaimButton">Получить</button></div><p class="relic-daily-note">Пропущенные дни не сгорают: продолжай календарь при следующем входе. После 31-й награды начнётся новый цикл.</p></section></div>');const toggle=document.getElementById('relicSettingsToggle');if(toggle)toggle.onclick=()=>relicToggleMenu();const float=document.getElementById('relicDailyFloat');if(float)float.onclick=()=>relicOpenDaily();const backdrop=document.getElementById('relicMenuBackdrop');if(backdrop)backdrop.onclick=relicCloseMenu;const panel=document.getElementById('relicSettingsPanel');panel.querySelector('[data-close-menu]').onclick=relicCloseMenu;panel.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{relicCloseMenu();const a=b.dataset.action;if(a==='shop')goView('shop');else if(a==='promo')redeemPromo();else if(a==='nickname')changeNickname();else goView(a)});const motion=document.getElementById('relicMotion');const off=localStorage.getItem('crabRelicMotion')==='off';document.body.classList.toggle('relic-motion-off',off);motion.classList.toggle('on',!off);motion.onclick=()=>{const enabled=document.body.classList.contains('relic-motion-off');document.body.classList.toggle('relic-motion-off',!enabled);motion.classList.toggle('on',enabled);localStorage.setItem('crabRelicMotion',enabled?'on':'off')};const modal=document.getElementById('relicDailyModal');modal.onclick=e=>{if(e.target===modal||e.target.closest('[data-close-daily]'))relicCloseDaily()};document.getElementById('relicClaimButton').onclick=relicClaimDaily;}
function relicToggleMenu(){const p=document.getElementById('relicSettingsPanel'),b=document.getElementById('relicMenuBackdrop'),t=document.getElementById('relicSettingsToggle');const open=!p.classList.contains('open');p.classList.toggle('open',open);b.classList.toggle('show',open);t.classList.toggle('active',open);}
function relicCloseMenu(){document.getElementById('relicSettingsPanel')?.classList.remove('open');document.getElementById('relicMenuBackdrop')?.classList.remove('show');document.getElementById('relicSettingsToggle')?.classList.remove('active');}
let relicDaily=null,relicDailyBusy=false;
async function relicOpenDaily(){const m=document.getElementById('relicDailyModal');m.classList.add('show');document.body.classList.add('relic-modal-open');document.getElementById('relicDailyRewardLabel').textContent='Загружаем…';document.getElementById('relicClaimButton').disabled=true;try{relicDaily=await api('/api/daily-rewards');relicDrawDaily()}catch(e){document.getElementById('relicDailyRewardLabel').textContent=e.message}}
function relicCloseDaily(){document.getElementById('relicDailyModal')?.classList.remove('show');document.body.classList.remove('relic-modal-open')}
function relicRewardIcon(k){return relicSvg(k==='coin'?'coin':k==='dna'?'dna':k==='shell'?'shell':k==='chest'?'chest':'crown')}
function relicDrawDaily(){if(!relicDaily)return;const s=relicDaily,claimed=new Set((s.claims||[]).filter(x=>x.cycle===s.cycle).map(x=>x.day)),day=s.claimable_day,done=s.day_index;document.getElementById('relicDailyProgressText').textContent=done+' / 31 наград';document.getElementById('relicDailyProgressBar').style.width=(done/31*100)+'%';document.getElementById('relicDailySubtitle').textContent=s.claimed_today?'Награда на сегодня уже забрана':'Забери награду за текущий день';document.getElementById('relicCalendarGrid').innerHTML=s.rewards.map((r,i)=>{const d=i+1,got=claimed.has(d),ready=d===day&&!s.claimed_today;return '<div class="relic-calendar-day '+(got?'claimed':ready?'ready':'locked')+'"><span class="relic-day-number">'+(got?'✓':String(d).padStart(2,'0'))+'</span><span class="relic-day-icon">'+relicRewardIcon(r.icon)+'</span><small>'+esc(r.label)+'</small></div>'}).join('');const r=s.rewards[(day||Math.max(1,done))-1];document.getElementById('relicDailyRewardLabel').textContent=s.claimed_today?'Возвращайся завтра':(r?r.label:'Награда дня');const b=document.getElementById('relicClaimButton');b.disabled=s.claimed_today||!day||relicDailyBusy;b.textContent=s.claimed_today?'Получено ✓':'Забрать награду'}
async function relicClaimDaily(){if(relicDailyBusy)return;relicDailyBusy=true;relicDrawDaily();try{const r=await api('/api/daily-rewards/claim','POST',{});relicDaily=r.state;toast('День '+r.day+' · '+r.reward.label);relicDrawDaily();await refresh()}catch(e){toast(e.message);try{relicDaily=await api('/api/daily-rewards');relicDrawDaily()}catch(_){}}finally{relicDailyBusy=false;relicDrawDaily()}}



let shopData=null;
async function loadShop(){try{shopData=await api('/api/shop');if(currentView==='shop')renderShop()}catch(e){toast(e.message)}}
function renderShop(){const el=app.querySelector('.panel');if(!el||currentView!=='shop')return;el.innerHTML='<div class="section-title">🛍️ Магазин</div><div class="sub">Твои раковины: '+num(shopData.shells)+' 🐚</div><h3>За раковины</h3>'+shopData.shell_items.map(i=>'<div class="rowitem"><b>'+esc(i.title)+'<div class="sub">Цена: '+i.shells+' 🐚</div></b><button onclick="buyShell(\''+i.key+'\')">Купить</button></div>').join('')+'<h3>За Telegram Stars</h3>'+shopData.stars_items.map(i=>'<div class="rowitem"><b>'+esc(i.title)+'<div class="sub">'+esc(i.description)+'</div></b><span>'+i.stars+' ⭐ <button onclick="buyStars(\''+i.key+'\')">Купить</button></span></div>').join('')}
window.buyStars=k=>action(async()=>{const r=await api('/api/shop/invoice','POST',{key:k});if(!tg?.openInvoice)throw new Error('Telegram invoice UI unavailable');tg.openInvoice(r.url,status=>{if(status==='paid'){toast('Платёж прошёл!');setTimeout(()=>refresh(),1500)}else if(status==='failed')toast('Платёж не прошёл');else if(status==='cancelled')toast('Покупка отменена')})});
window.buyShell=k=>action(async()=>{const r=await api('/api/shop/shell','POST',{key:k});await loadExtra();await loadShop();toast(r.message)});
window.openChest=k=>action(async()=>{const r=await api('/api/chest/open','POST',{key:k});await loadExtra();toast('Сундук открыт! Раковины: '+r.loot.shells+', камней: '+r.loot.stones.length+(r.loot.mutation?' · мутация получена':''))});
window.redeemPromo=()=>{const code=prompt('Введи промокод:');if(code)action(async()=>{const r=await api('/api/promo','POST',{code});await refresh();toast('Промокод активирован!')})};

window.molt=()=>{if(!confirm('Линька сбросит уровень, золото и эволюцию. Продолжить?'))return;action(async()=>{const r=await api('/api/molt','POST',{});state=r.state;currentView='home';await loadExtra();toast('Линька завершена! Получено '+num(r.dna)+' ДНК')})};
async function loadEvents(){try{const r=await api('/api/events');const el=document.getElementById('eventsbox');if(!el)return;if(!r.unlocked){el.innerHTML='<h3>🐉 Ивенты закрыты</h3><p>Нужно выполнить хотя бы одно условие: '+r.requirements.molts+' линьки, рекорд '+r.requirements.meters+' м или '+r.requirements.kills+' убийств.</p>';return}if(!r.event){el.innerHTML='<h3>🌊 Активных ивентов нет</h3><p>События запускаются автоматически. Загляни позже.</p>';return}el.innerHTML='<h3>'+esc(r.event.name)+'</h3><p>'+esc(r.event.description)+'</p><h3>Урон игроков</h3>'+r.event.leaderboard.map((p,i)=>'<div class="rowitem"><b>#'+(i+1)+' '+esc(p.nickname)+'</b><span>'+num(p.damage)+'</span></div>').join('')}catch(e){toast(e.message)}}


window.adminGrantCurrency=()=>{const id=prompt('Telegram ID игрока:');if(!id)return;const currency=prompt('Валюта: gold (золото), dna_points (ДНК), nautilus_shells (раковины)');if(!currency)return;const amount=prompt('Количество: положительное — выдать, отрицательное — списать');if(!amount)return;action(async()=>{const r=await api('/api/admin/grant','POST',{kind:'currency',user_id:id,currency,amount:Number(amount)});toast('Игрок '+r.player+': '+r.amount+' '+r.kind);await refresh()})};
window.adminGrantItem=()=>{const id=prompt('Telegram ID игрока:');if(!id)return;const type=prompt('Тип предмета: chest, resource, stone, mutation, nectar');if(!type)return;const key=prompt('Ключ предмета (камень: color:level, например blue:1)');if(!key)return;const amount=prompt('Количество');if(!amount)return;action(async()=>{const r=await api('/api/admin/grant','POST',{kind:'item',user_id:id,item_type:type,item_key:key,amount:Number(amount)});toast('Предмет выдан игроку '+r.player);await refresh()})};
window.adminCreatePromo=()=>{const code=prompt('Код промокода (латиница/цифры/_/-):');if(!code)return;const gold=Number(prompt('Золото (0 если не нужно)','0')||0),dna=Number(prompt('ДНК (0 если не нужно)','0')||0),shells=Number(prompt('Раковины (0 если не нужно)','0')||0);const type=prompt('Тип предмета: chest, resource, stone, mutation, nectar. Оставь пустым, если только валюта.','');let item_key='',item_count=0;if(type){item_key=prompt('Ключ предмета (stone: color:level, например blue:1)');item_count=Number(prompt('Количество предмета','1')||0)}const max_uses=Number(prompt('Общий лимит активаций (0 = без лимита)','0')||0),expires_hours=Number(prompt('Срок действия в часах (0 = бессрочно)','0')||0);action(async()=>{await api('/api/admin/promos','POST',{code,gold,dna,shells,item_type:type||'',item_key,item_count,max_uses,expires_hours});toast('Промокод '+code+' создан');loadAdminPromos()})};
window.loadAdminPromos=async()=>{try{const r=await api('/api/admin/promos');const el=document.getElementById('adminpromos');if(!el)return;el.innerHTML=r.promos.length?r.promos.map(p=>'<div class="rowitem"><div><b>'+esc(p.code)+'</b><div class="sub">Использовано '+p.used_count+(p.max_uses?' / '+p.max_uses:' / ∞')+' · '+esc(JSON.stringify(p.rewards))+'</div></div>'+(p.active?'<button class="btn secondary" onclick="adminDisablePromo(\''+esc(p.code)+'\')">Отключить</button>':'<span>Отключён</span>')+'</div>').join(''):'<p>Промокодов пока нет.</p>'}catch(e){toast(e.message)}};
window.adminDisablePromo=code=>action(async()=>{await api('/api/admin/promos/disable','POST',{code});toast('Промокод отключён');loadAdminPromos()});

window.goView=async v=>{if(v==='admin'&&!state.is_admin){toast('Доступ запрещён');return;}currentView=v;if(v==='home'){render();return}await loadExtra();render();if(v==='shop')await loadShop()};
window.digStart=h=>action(async()=>{await api('/api/dig/start','POST',{hours:h});await loadExtra();toast('Краб отправлен копать!')});
window.digCollect=()=>action(async()=>{const r=await api('/api/dig/collect','POST',{});await loadExtra();toast('Добыча собрана: '+r.stones.length+' камней, '+r.resources.length+' ресурсов')});
window.mutAction=(a,k)=>action(async()=>{const r=await api('/api/mutations/action','POST',{action:a,key:k});await loadExtra();toast(a==='buy'?'Мутация приобретена!':a==='upgrade'?'Мутация улучшена!':'Экипировка обновлена')});
window.nectarAction=(a,k)=>action(async()=>{await api('/api/nectar/action','POST',{action:a,key:k});await loadExtra();toast(a==='craft'?'Нектар создан!':'Нектар экипирован')});
window.evolutionPick=k=>action(async()=>{await api('/api/evolution/pick','POST',{key:k});await loadExtra();toast('Эволюция выбрана!')});

async function loadRandomPlayers(){try{const r=await api('/api/players/random');const el=document.getElementById('randombox');if(el)el.innerHTML=r.players.map(p=>'<div class="rowitem"><b>'+esc(p.nickname)+'<div class="sub">'+p.level+' ур. · '+p.molts+' линек · '+esc(p.zone)+'</div></b><button onclick="viewPlayer('+JSON.stringify(p.nickname)+')">Профиль</button></div>').join('')}catch(e){toast(e.message)}}
window.randomPlayers=async()=>{currentView='random';await loadExtra();render()};
window.viewPlayer=async n=>{try{playerData=await api('/api/player/search','POST',{nickname:n});currentView='player';await loadExtra();render()}catch(e){toast(e.message)}};

window.searchPlayer=async()=>{const name=prompt('Ник игрока:');if(!name)return;try{playerData=await api('/api/player/search','POST',{nickname:name});currentView='player';await loadExtra();render()}catch(e){toast(e.message)}};
window.changeNickname=()=>{const n=prompt('Новый ник (3–16 символов):',state.nickname);if(n)action(async()=>{await api('/api/nickname','POST',{nickname:n});await refresh();toast('Ник изменён')})};
async function loadLeaderboard(){try{const r=await api('/api/leaderboard');if(currentView==='leaderboard'){const p=app.querySelector('.panel');p.innerHTML='<div class="section-title">🏆 Топ игроков</div>'+r.players.map(x=>'<div class="rowitem"><b>#'+x.rank+' '+esc(x.nickname)+'<div class="sub">'+x.level+' ур. · '+x.molts+' линек · '+esc(x.zone)+'</div></b><span>'+num(x.meters)+' м</span></div>').join('')}}catch(e){toast(e.message)}}

if(!initData){app.innerHTML='<div class="top"><div class="brand">CRAB RPG<strong>ABYSS</strong></div><div class="avatar">🦀</div></div><div class="panel"><div class="notice">Чтобы открыть игру, запусти Crab RPG в Telegram и нажми кнопку Web App. Внешний браузер не передаёт Telegram initData.</div></div>'}else refresh();
})();
</script>
</body>
</html>
