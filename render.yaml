services:
  - type: worker
    name: crab-rpg-bot
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: crab-game-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "7694677506"
      - key: DB_PATH
        value: /data/crab_game.db
